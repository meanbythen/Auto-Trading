# 交易所休市日历（只写工作日；周末本来就不交易，不用写）。
# 每年国务院公布次年放假安排后，在下面追加一年的列表，程序不用改代码。
# 注意：某一年写了空列表，表示「该年已确认没有节假日」，不会被当成缺配置。
# 实盘（CTP 且关掉模拟）启动时，节假日表必须盖住未来约 60 天，否则只许平仓不许开仓。
# 11 月之后必须先有下一年的年份条目，哪怕长假还没公布，也至少写上元旦。
# 临时休市/调休仍写 config.yaml 的 schedule.closed_days。
version: 1
years:
  2026:
    - "2026-01-01"  # 元旦
    - "2026-02-16"  # 春节
    - "2026-02-17"
    - "2026-02-18"
    - "2026-02-19"
    - "2026-02-20"
    - "2026-04-06"  # 清明
    - "2026-05-01"  # 劳动节
    - "2026-05-04"
    - "2026-05-05"
    - "2026-06-19"  # 端午
    - "2026-09-25"  # 中秋
    - "2026-10-01"  # 国庆
    - "2026-10-02"
    - "2026-10-05"
    - "2026-10-06"
    - "2026-10-07"
  2027:
    - "2027-01-01"  # 元旦。春节等长假国务院公布后再补；有这一年条目，实盘才不会因「盖不到明年」禁开仓。
