# ============================================================
# 华泰期货 · 沥青/玉米 · 多策略/多通道路线配置
# copy config\config.example.yaml config\config.yaml
#
# 【路线菜单】只改下面两个开关即可切换（一次只跑一套，不并行）
#
# 1) 策略引擎 strategy.engine（主推 daily_body）
#    - daily_body            日内实体：ETH画开盘箱体，收盘突破才开
#    - trend_follow / supertrend / dual_ma / ema_swing
#
# 2) 执行通道 trade.executor
#    - sim   模拟成交（默认，不下真单）
#    - gui   点击同花顺界面（需标定坐标；未开程序化时的实盘路径）
#    - ctp   华泰 CTP。填好前置、BrokerID、认证码后再切换，没填好不会发单
# ============================================================

dry_run: true

# 交易账本与风控：JSON 仍是权威来源；SQLite 是可删除、可重建的同步投影。
# 关闭 sqlite_enabled 后只读写 JSON/JSONL，不创建 trading.db。
storage:
  sqlite_enabled: true
  database: "data/trading.db"

app:
  path: "D:\\同花顺期货通\\bin\\hexinlauncher.exe"
  window_title: "期货通"
  startup_wait_sec: 15

account:
  broker: "华泰期货"
  channel: "华泰期货_CTP主席"
  user_id: "你的资金账号"
  password_env: "FUTURES_PASSWORD"
  captcha_mode: "pause"
  # 配置页「自动登录」打开时，这里是 false。模板保持 true，复制成新配置时不会自动去点登录。
  skip_auto_login: true
  force_relogin: false

schedule:
  login_times:
    - "08:50"
    - "20:50"
  # 15分钟策略：扫描间隔可 30~60 秒
  scan_interval_sec: 30
  # 全时段 / 只做日盘 / 只做夜盘 / 夜日连续（跳空小）。
  # 前三项只决定能不能开新仓。夜日连续只建议隔夜跳空小的品种：夜盘拿到日盘，跳空大时回撤会很大。
  session_scope: all
  trading_sessions:
    - ["09:00", "11:30"]
    - ["13:30", "15:00"]
    - ["21:00", "02:30"]
  # 交易所休市日历：工作日节假日写这里，跨年只需改文件不用升级程序。
  # 实盘启动会检查日历是否覆盖未来 holiday_min_cover_days 天，缺年份只禁止开仓。
  holidays_file: "config/holidays.yaml"
  holiday_min_cover_days: 60
  # 外置日历之外再加的休市日（临时休市/调休），写 "2026-12-31" 这种日期。
  # 这些天不清仓、不预约收盘清仓，待办留到下一个交易日。
  closed_days: []

# ---------- 策略引擎（见文件顶部路线菜单） ----------
strategy:
  # 切换策略：daily_body | trend_follow | supertrend |
  # dual_ma | ema_swing | bollinger | sar_trend | multi_factor | swing_trend |
  # dual_donchian | dual_fractal | swing_box |
  # rule_dsl（自己写的规则文件，见本文件底部 rule_dsl 小节）
  engine: "daily_body"
  # 信号周期：5 / 15 / 60 是分钟。日线写 D，周线写 W。自定义分钟直接写数字，如 120
  timeframe: "5"
  # 移动止损周期：比信号周期钝一档，少被噪音扫出
  trail_timeframe: "15"
  # 关注列表。第一项是当前合约，例如 bu2612。界面上选中的会排到第一项，启动时只盯第一项
  symbols:
    - "bu2612"
  # 交叉测试要跑的策略。不写就用程序里的每一套。正在用的策略仍是上面的 engine。
  cross_engines:
    - daily_body
    - trend_follow
    - supertrend
    - dual_ma
    - ema_swing
    - bollinger
    - sar_trend
    - multi_factor
    - swing_trend
    - dual_donchian
    - dual_fractal
    - swing_box
  # 交叉测试勾选的周期：5 / 15 / 30 / 60 分钟，日线 D，周线 W。
  # 不写时界面按当前信号周期勾一档。点开始交叉测试时会把勾选写回这里。
  cross_periods:
    - "5"
  flatten_times:
    - "14:55"
    - "22:55"
  # true=到清仓时刻强平；false=不按收盘平仓，仓可以留过午盘、夜盘和周末
  flatten_at_close: true
  # 止损触发方式（全策略共用）：touch=价格触及止损位立刻平（实时看影线）；
  # close=等这根K线收盘，收盘价跌破/站上止损位才平（默认，回测/实盘口径一致）。
  stop_mode: close
  # 开仓触发方式（全策略共用）：trigger=未收线那根的最高/最低碰到开仓位就进（激进）；
  # close=等这根K线收盘，收盘价穿越开仓位才进（保守，默认）。只在模拟盘/实盘生效。
  entry_mode: close
  # 通用止损（独立于各策略自身止损，谁先触发就平）：
  # off=关闭（默认，只用策略自身止损）；sar=SAR 移动止损（按止损周期计算，
  # 初始 SAR 与持仓方向相反时先等它转向，不会一开仓就被误触）；
  # prior_extreme=前 N 根高低点止损（多守最近 N 根最低，空守最高）；
  # chandelier=Chandelier 吊灯跟踪（多=最近 N 根最高 - k×ATR，空=最近 N 根最低 + k×ATR，
  #   随新高/新低移动；旧高低点滑出回看窗口时这条线会跟着回退）；
  # breakeven=盈利1ATR后保本（浮盈达到 be_atr_mult×ATR 后，止损抬到开仓价，之前不生效）。
  # 触发口径同样听 strategy.stop_mode；回测、策略优化、实盘都生效。
  generic_stop:
    kind: "off"
    lookback: 20
    sar_af_start: 0.02
    sar_af_step: 0.02
    sar_af_max: 0.2
    atr_period: 14
    atr_mult: 3.0
    be_atr_mult: 1.0

  # 启动常驻后的第一轮扫描：往前最多看几根已收盘信号 K 线，条件仍合适就补开一笔。
  # 之后每轮仍只看最新一根，不会反复补单。关掉 enabled 就完全不回溯。
  # max_chase_atr：信号 K 线自己走得太远就不补开（多头看 收盘价-最低价，空头看 最高价-收盘价），
  #   超过 max_chase_atr×ATR 说明已经贴着止损进场，补开等于追高。0 表示不限制。
  catch_up_on_start:
    enabled: true
    lookback_bars: 3
    max_age_minutes: 20
    max_entry_atr: 0.5
    max_chase_atr: 2.0
    atr_period: 14

  # 以损定开（engine=liq_stop）。击穿止损聚集区后回流确认，止损放区间外侧。
  liq_stop:
    zone_lookback: 20
    zone_tol: 0.005
    pivot_span: 2
    atr_period: 20
    adx_period: 14
    adx_min: 20.0
    break_window: 3
    entry_offset: 0.5
    stop_atr: 1.0
    take_profit: true
    reward_risk: 2.0
    vol_mult: 0.0

  # 凯利突破（engine=kelly_break）。收盘突破前 N 根高低点，固定盈亏比止盈。
  kelly_break:
    lookback: 20
    atr_period: 14
    stop_atr: 1.2
    take_profit: true
    reward_risk: 2.5
    min_atr_ratio: 0.0

  # 趋势跟随 / 海龟突破（engine=trend_follow）。收盘冲破前 N 根最高做多、跌破最低做空。
  # 文档 5 分钟口径：进场 20 根、出场 10 根、止损 2ATR，日内收盘强平。
  # 只想保持原有 36/12 的，把下面两个数改回去即可。
  trend_follow:
    entry_bars: 20
    exit_bars: 10
    atr_period: 14
    atr_mult: 2.0
    flatten_at_close: true
    # 本策略趋势过滤：ADX 太低或波动压缩不开新仓。默认关。
    filter_enabled: false
    filter_adx_period: 14
    filter_atr_period: 14
    filter_lookback: 60
    filter_adx_flat: 20
    filter_atr_low_pct: 0.2

  # SuperTrend（engine=supertrend / st）。ATR 通道翻转开仓；默认不听收盘清仓总开关。
  supertrend:
    atr_period: 10
    multiplier: 3.0
    reverse_on_flip: true
    flatten_at_close: false
    filter_enabled: false
    filter_adx_period: 14
    filter_atr_period: 14
    filter_lookback: 60
    filter_adx_flat: 20
    filter_atr_low_pct: 0.2

  # 双均线趋势（engine=dual_ma / ma_cross）。短线上穿长线、且收盘站上长线才做多；反向做空。
  # 止损用 2 倍 ATR（文档口径），比原来的「开仓那根高低点」宽，不容易被正常波动扫掉。
  dual_ma:
    short_period: 20
    long_period: 60
    reverse_on_cross: true
    atr_period: 14
    atr_stop_mult: 2.0
    filter_enabled: false
    filter_adx_period: 14
    filter_atr_period: 14
    filter_lookback: 60
    filter_adx_flat: 20
    filter_atr_low_pct: 0.2

  # 均线波段（engine=ema_swing）。方向、信号均线根数自己填。
  # 多空分界线 / 止损 / 倾角各一根，出厂都是 120。旧名 macd_swing。
  ema_swing:
    dir_ema_pair: 60/120
    sig_ema_triple: 5/10/30
    # 上面两个「成对/三根」标签拆开后的实际根数；优化改参数时会写回这里。
    dir_ema_fast: 60
    dir_ema_slow: 120
    ema_fast: 60
    ema_slow: 120
    sig_ema_a: 5
    sig_ema_b: 10
    sig_ema_c: 30
    side_ema: 120
    stop_ema: 120
    slope_ema: 120
    slope_min_deg: 3.0
    slope_lookback: 20
    slope_exit: false
    no_open_before_close_min: 30
    flatten_at_close: false

  # 布林带趋势突破（engine=bollinger）。只顺势：中轨上方突破上轨做多，中轨下方跌破下轨做空。
  # 不做轨道反转（那是均值回归）。跌回中轨离场，止损 1.5 倍 ATR。
  bollinger:
    boll_window: 20
    boll_dev: 2.0
    atr_period: 14
    atr_stop_mult: 1.5
    flatten_at_close: true  # 布林听上面的总开关；保存时会把这一项改成和总开关一样
    filter_enabled: false
    filter_adx_period: 14
    filter_atr_period: 14
    filter_lookback: 60
    filter_adx_flat: 20
    filter_atr_low_pct: 0.2

  # SAR 波段（engine=sar_trend）。SAR 翻多做多、翻空做空，再用 ma_filter 均线过滤方向。
  # SAR 线本身就是移动止损，不额外设固定止损。跳空大的品种靠市场过滤兜底。
  sar_trend:
    af_start: 0.02
    af_step: 0.02
    af_max: 0.2
    ma_filter: 20
    atr_period: 14
    flatten_at_close: true  # SAR 听上面的总开关；保存时会把这一项改成和总开关一样
    filter_enabled: false
    filter_adx_period: 14
    filter_atr_period: 14
    filter_lookback: 60
    filter_adx_flat: 20
    filter_atr_low_pct: 0.2

  # 多因子 CTA 完整版（engine=multi_factor 加权打分）。信号周期跟上面的 timeframe。
  # 日线收盘相对 EMA 定方向（bias_ma 根）；SAR 开关在这一节，不是总开关。权重不参与自动优化。
  multi_factor:
    ma_short: 20
    ma_long: 60
    channel: 20
    boll_window: 20
    boll_dev: 2.0
    af_start: 0.02
    af_step: 0.02
    af_max: 0.2
    threshold: 0.6
    atr_period: 14
    atr_stop_mult: 2.0
    use_sar: true
    disagree_max: 0.7
    bias_ma: 60
    trend_timeframe: "D"
    weights:
      ma: 0.30
      turtle: 0.25
      boll: 0.25
      sar: 0.20
    flatten_at_close: true  # 多因子听上面的总开关；保存时会把这一项改成和总开关一样
    # 本策略自己的行情闸门，不走页面底下那张公共过滤。
    cta_filter:
      enabled: true
      use_adx: true
      use_atr: true
      use_disagree: true
      adx_period: 14
      adx_flat: 20
      adx_trend: 25
      atr_lookback: 60
      atr_low_pct: 0.2
      weak_score: 0.75
      weak_size: 0.5
      weak_votes: 0

  # 日内实体（engine=daily_body 时生效）。
  # 方向看信号周期。ETH 走完后，收盘离开开盘区间才开仓。夜盘用夜盘自己的区间。
  # 止损固定在开盘箱体对沿再让 stop_extra_ticks 跳（默认 1）：多守箱底、空守箱顶，开仓后冻结。
  # 触发方式用全策略共用的 strategy.stop_mode：touch 触及即止损；close 等收盘价确认。
  # 没触发就顺着捅破方向拿到收盘。中间不做回撤止损。
  # 策略优化只搜：第一ETH窗口、信号周期、止损触发方式。配置页可改两个 ETH 窗口、箱沿外再让几跳、跳空上限、箱体宽度上限。
  daily_body:
    eth_minutes: 20
    # 第二ETH窗口：也从开盘起算。过了这个时间丢掉第一窗口。日盘止损后还可按这口再开。0=关闭。
    eth_minutes2: 30
    stop_extra_ticks: 1
    # 开盘相对上一段收盘跳空超过开盘前 ATR 的多少倍就不开；0=关闭。出厂 2.5。
    skip_gap_atr_mult: 2.5
    # 开盘箱体最高-最低超过开盘前 ATR 的多少倍就不开；0=关闭。出厂 5。
    max_box_atr_mult: 5.0
    # 信号收盘离破位超过开盘前 ATR 的多少倍就先等回抽；0=关闭。出厂 1。
    max_chase_atr_mult: 1.0
    # 急破后等回抽：收盘没有效突破这条 EMA 就作废这次突破。ema_period=0 关闭。
    ema_period: 20
    ema_buffer_ticks: 2
    # 开仓截止钟点：过了这个钟点，这一段不再开新仓。日盘和夜盘分开设。
    day_cutoff: "10:30"
    night_cutoff: "22:15"
    # 本策略自带的箱体突破过滤：ADX 过高（强单边）不开，不拦波动压缩。关了这一层就不看。
    filter_enabled: true
    filter_adx_period: 14
    filter_atr_period: 14
    filter_lookback: 60
    filter_adx_upper: 30
    filter_atr_high_pct: 0.8

  # 长线趋势加减仓（engine=swing_trend）。
  # scale 只定大周期方向：D_60=日线，60_15=60分钟。
  # 回调进出跟上面的 timeframe，止损跟 trail_timeframe。没填时退回搭配里的小周期。
  # 浮盈后可再回调加仓，伸展过远先减仓。
  # 加仓上限 = 单元手数 ×（1+最多加仓次数）。默认不收盘清仓。
  swing_trend:
    scale: "D_60"
    signal_timeframe: "60"
    trend_timeframe: "D"
    daily_ma: 20
    signal_ma: 20
    atr_period: 14
    pullback_lookback: 8
    touch_atr: 0.6
    unit_volume: 1
    max_adds: 2
    add_min_atr: 1.0
    reduce_extend_atr: 2.5
    min_core_units: 1
    stop_atr: 2.0
    flatten_at_close: false
    filter_enabled: false
    filter_adx_period: 14
    filter_atr_period: 14
    filter_lookback: 60
    filter_adx_flat: 20
    filter_atr_low_pct: 0.2

  # 双周期通道突破（engine=dual_donchian）。
  # 大周期通道+ADX 定方向；小周期唐奇安突破。进出跟 timeframe，止损跟 trail_timeframe。
  dual_donchian:
    trend_timeframe: "D"
    entry_bars: 55
    exit_bars: 20
    htf_donchian: 55
    adx_period: 14
    adx_min: 22
    atr_period: 14
    atr_mult: 2.5
    flatten_at_close: false

  # 双周期回调分型（engine=dual_fractal）。
  # trend_mode: ema=大周期指数均线；donchian=大周期通道。小周期强分型+DIF 背离。
  dual_fractal:
    trend_timeframe: "D"
    trend_mode: "ema"
    trend_ema: 20
    htf_donchian: 55
    adx_period: 14
    adx_min: 22
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    atr_period: 14
    atr_mult: 2.8
    flatten_at_close: false

  # 长线箱体突破（engine=swing_box）。收盘走出箱子才顺着做。
  # 信号周期、止损周期跟上面的 timeframe / trail_timeframe。没填时默认日线。
  # 默认不收盘清仓。手数仍用公共每笔风险%。
  swing_box:
    lookback: 40
    peak_look: 2
    min_gap: 5
    atr_period: 20
    height_atr: 1.2
    adx_period: 14
    adx_min: 20
    stop_atr: 0.5
    trail_atr: 2.0
    trail_start_h: 1.0
    vol_mult: 0
    flatten_at_close: false

  # 自定义规则（engine=rule_dsl）。不写代码，用指标条件组合搭一套策略。
  # 规则写在 config/rules/ 下的 YAML 里，只改下面这一行指向自己的文件。
  # 条件只按已收盘的 K 线判断，成交价仍由回测/实盘引擎决定，不会出现未来函数。
  # 规则写错时程序会拒绝开仓并写一条告警，不会悄悄换成别的策略。
  # 完整写法见 config/rules/dual_ma_equiv.yaml（文件里逐行注释了每种条件）。
  # 现成模板：dual_ma_equiv / dualthrust / r_breaker / turtle_adx / adx_atr_break。
  # 指标支持 expr 公式（+ - * /、括号、max/min/abs），能表达 DualThrust、R-Breaker 的档位算法。
  # 顶部「策略编辑器」页签可以直接编辑并保存 YAML；每次保存都会注册成
  # 一个独立引擎 rule_dsl:<文件名>，在配置页的策略引擎下拉里就能选（engine 填这个代号即可）。
  # 保存不会自动切换运行策略，需要时自己去下拉里选。
  # config/rules/ 下带 builtin: true 的是程序自带模板，不能删改/覆盖；想改就
  # 在编辑器里换个文件名「保存」另存为自己的规则，再在下拉里选新引擎。
  rule_dsl:
    file: "rules/dual_ma_equiv.yaml"
    # 是否接公共行情过滤（ADX/波动率）。规则里自己写了 filters 时可保持 false。
    use_market_filter: false

data:
  source: "tq"
  # 行情来源。tq 是天勤（主源），akshare 是新浪（备源）。界面下拉里选，一次只用一家。
  # 两家的K线分开存放：新浪用原合约名，天勤加 @tq（如 fu2701@tq）。同花顺图只给回测，加 @ths。
  cache_dir: "data/klines"
  # 每次下载都会追加进 data/klines/market.sqlite。新浪不再提供的旧K线留在库里，回测按日期从库里取。
  min_bars: 80
  live_max_bars: 200   # 实盘扫描只看最近这些根；库里更早的不删
  max_stale_minutes: 90  # 缓存K线超过该分钟数则禁止开仓（仍可平仓）
  # 天勤要账号密码。账号写在这里，密码建议放 config/secrets.local.yaml 的 tq_password，
  # 或设环境变量 TQ_PASSWORD，不要直接写进这个文件。
  tq:
    user: ""
    password: ""
    # 专业版试用期才打开：批量下载历史 tick（免费账号没有这个权限）。
    # 先单品种单月验证，再按需扩品种和日期。下载原始 csv 会保留，可断点续传。
    history_tick:
      enabled: false
      main_cont_list:            # 天勤主连代码：KQ.m@交易所.品种
        - "KQ.m@SHFE.fu"
      start: "2026-10-01"
      end: "2026-10-31"
      chunk_days: 1              # 每段下载天数，也是断点续传粒度
      out_dir: "data/ticks/history"
      keep_raw_csv: true
  # 天勤 tick：免费账号盘中常驻采集，落本地库，收盘后合成 K 线供回测。
  tick:
    enabled: false               # 默认不自动启动，避免没配账号时反复重连
    symbols: []                  # 空=用配置页关注品种；也可填真实合约如 fu2701
    resolve_main: true           # 只填品种时自动解析当前主力真实合约
    flush_seconds: 5
    batch_size: 2000
    database: "data/ticks/vnpy_data.db"
    raw_csv: false               # 额外保留原始 csv.gz
    status_file: "data/ticks/recorder_status.json"
    reconnect_seconds: 5
    max_backoff_seconds: 60
    bar_store: "data/klines/tick_bars.sqlite"
    synth_periods: ["1", "5", "15", "30", "60", "D"]
  # 天勤失败时是否回退新浪。回退数据单独按新浪原名入库，并带 fallback_from=tq 标记。
  fallback_source: "akshare"
  fallback_allow_entry: true     # 回退行情是否允许开新仓；false 时只允许平仓/止损
  symbol_map:
    bu: "BU0"
    c: "C0"
    沥青: "BU0"
    玉米: "C0"
    bu2612: "BU2612"

# 历史回测 / 策略优化（界面「历史回测」「策略优化」选项卡）
backtest:
  max_bars: 1200
  warmup: 40
  max_trials: 60
  # 交叉测试并行进程数。0=按 CPU 自动（最多 4 个）；组合少时会自动退回单进程。
  cross_workers: 0
  # 策略优化参数表：网格档位、参数中文名、取值说明。改完保存即生效，不用改代码。
  optimizer_table: "config/优化参数.xlsx"
  range_preset: "全部可用"
  start_date: ""          # 空着时，界面默认填当年1月1日
  end_date: ""
  # 成交近似：信号下一根开盘价成交；滑点按买卖方向各让几跳。
  fill_on_next_open: true
  slippage_ticks: 1.0
  # 打开后回测开仓再套挂机的过期K和追价上限。默认关，不改原来的回测成绩。
  mirror_live_gates: false
  # 涨跌停/部分成交/挂单超时（默认开启，会改变回测成绩；要复现旧成绩就改成 false/0）：
  #   block_limit_locked: 成交这根最高=最低（一字板）时不开仓，平仓顺延到下一根。
  #   max_volume_pct: 单根新开仓手数不超过该根成交量的比例，超出算部分成交、余量当根撤单，0=不限。
  #   entry_timeout_bars: 开仓挂单最多等几根可成交K线，等到超时按撤单处理。
  liquidity:
    block_limit_locked: true
    max_volume_pct: 0.1
    entry_timeout_bars: 1
  # 策略优化：搜索深度、防过拟合方式（一次性留出 / 滚动验证）。
  optimize_depth: "标准"
  optimize_mode: "一次切断"
  optimize_holdout_pct: 30
  optimize_walk_steps: 3
  # 最后半年只验收、不搜参数。看过一次就不能再用同一段当最终验收。
  freeze_final_oos: true
  freeze_final_days: 180

# 策略评估门槛（回测/优化共用）。缺项按程序默认值处理。
evaluation:
  enabled: true
  adx_period: 14
  adx_trend_min: 20
  stress_on_backtest: true
  gate_on_optimize: true
  stress_min_trades: 30
  profit_factor_min: 1.3
  r_expect_min: 0.12          # 最低收益期望（界面名）；低于它只给观察
  calmar_min: 1.0
  max_drawdown_pct: 0.15
  profit_cover_min: 0
  trades_min: 150
  trades_observe: 100
  max_consecutive_losses: 8
  range_pf_max: 1.0
  range_trade_share_max: 0.3
  slippage_extra_ticks: 1.0
  slippage_pf_min: 1.2
  perturbation_step_pct: 0.1
  perturbation_pf_ratio: 0.8
  perturbation_pf_min: 1.1
  mc_runs: 500

# ---------- 执行通道（见文件顶部路线菜单） ----------
trade:
  symbol: "bu"
  volume: 1
  # 切换通道：sim | gui | ctp。没拿到前置和认证码之前保持 sim 或 gui
  executor: "sim"
  # CTP 上线四步：desk_sim 手工仿真 → desk_live 手工真实 → auto_sim 策略仿真 → auto_live 策略真实
  go_live:
    stage: desk_sim
  # 开仓滑点闸门：现价相对信号价反向偏移超过 0.5×ATR 就不追，等下一根。0=关闭
  max_entry_slip_atr: 0.5
  # 再叠一个绝对点数上限，和上面同时开就取更严的；0=不用
  max_entry_slip_points: 0
  ctp:
    # 当前使用哪份券商档案；必须与 ctp_profiles 里的名字一致。
    # 换期货公司/仿真环境时，只加一段 ctp_profiles 并改这里，不改代码。
    ctp_profile: huatai_sim
    # 公共默认值：档案里没写的字段用这里的。档案同名字段优先。
    # 上线阶段会同步这一项，一般不用手改。
    account_kind: sim
    app_id: "client_AutoTrading_1.0"
    flow_dir: "data/ctp_flow"
    price_tick: 1
    # 本机单笔最大手数：算仓时直接按它取小，超过不会发单；不是柜台上限。
    # 配置页「风控与资金管理」可改，回测不受影响。
    max_order_volume: 2
    order_count_warn: 8
    cancel_count_warn: 8
    query_interval_sec: 30
    order_wait_sec: 8
    # 报单超时自动撤单；撤单后最多等几秒确认。
    auto_cancel_on_timeout: true
    cancel_wait_sec: 3
    # 上期所、能源中心、大商所会自动拆平今/平昨。这里可再追加品种。
    close_split_products: ["bu", "c"]

    # 券商档案示例。一份档案一个柜台，仿真与实盘用同一套字段。
    # 真实档案 user_id 留空时沿用配置页「资金账号」。
    # 密码/认证码只写环境变量名，不写明文；默认 CTP_PASSWORD / CTP_LIVE_PASSWORD / CTP_AUTH_CODE。
    ctp_profiles:
      huatai_sim:
        label: 华泰仿真
        kind: sim
        td_front: "tcp://59.36.3.115:27226"
        md_front: "tcp://59.36.3.115:27236"
        broker_id: "8080"
        user_id: "28077"
        password_env: "CTP_PASSWORD"
        auth_code_env: "CTP_AUTH_CODE"
      simnow:
        label: SimNow 仿真
        kind: sim
        td_front: "tcp://180.168.146.187:10130"
        md_front: "tcp://180.168.146.187:10131"
        broker_id: "9999"
        user_id: ""
        password_env: "CTP_SIMNOW_PASSWORD"
        # 该柜台不需要认证码时留空。
        auth_code_env: ""
      huatai_live:
        label: 华泰真实
        kind: live
        # 可写多台。连接时全部登记，断线由柜台在列表里换。完整对照见 docs/华泰期货ctp主席新地址.md
        td_front:
          - "tcp://220.196.208.129:41206"
          - "tcp://220.196.208.130:41206"
          - "tcp://120.86.122.66:41206"
        md_front:
          - "tcp://220.196.208.129:41214"
          - "tcp://220.196.208.130:41214"
          - "tcp://120.86.122.66:41214"
        broker_id: "8080"
        user_id: ""
        password_env: "CTP_LIVE_PASSWORD"
        auth_code_env: "CTP_AUTH_CODE"

    # 旧写法（trade.ctp.sim / live、顶层 td_front/md_front/broker_id/user_id）已删除，
    # 程序只读 ctp_profiles。仿真与实盘用同一套字段，换柜台时改档案里的前置和 kind 即可。
    # 认证码不要写在这个文件里。放到环境变量 CTP_AUTH_CODE，或 config/secrets.local.yaml 的 ctp_auth_code
    # 仿真密码写 secrets.local.yaml 的 ctp_password（界面「账号」页可填）。真实通道默认用同一份交易密码；若不同再写 ctp_live_password。
    auth_code_env: "CTP_AUTH_CODE"
  gui:
    # 期货通默认无确认弹窗。0=点完买卖就结束，不要按回车。
    # 若账号打开了「下单确认」，改成 1 或 2，并选 enter / click / both。
    confirm_mode: both
    confirm_delay_sec: 0.2
    confirm_times: 0
    # true=点击后立刻改内部持仓（挂机方便，但点击≠成交）；false=只记发单不改仓（更安全）
    assume_fill: true
    # GUI 默认禁止多品种；标定了 symbol_input 且确需多品种时才开
    allow_multi_symbol: false
    # symbol_input: [1200, 380]  # 可选：品种输入框坐标
    # confirm_btn: [900, 600]   # 可选：弹窗「确定」按钮坐标
    # 启动常驻后，程序会把这个价格框设成「对手价」，之后下单只改手数、不改价格。
    # 对手价会立刻吃掉对面的挂单。最新价只是挂在刚成交的价格上，常常买不到、卖不掉。
    price_input: [1200, 400]
    volume_input: [1200, 450]
    buy_open_btn: [1200, 520]
    sell_open_btn: [1300, 520]
    close_btn: [1250, 560]

risk:
  # 手数取小：①意图（risk_pct 或 fixed）②仓位上限%
  # risk_pct：意图手数 = capital × risk_per_trade_pct% ÷ (止损距离 × 乘数)
  # fixed：意图手数 = trade.volume
  # 仓位上限：floor((权益×margin_usage_pct% − 已占用) ÷ 每手保证金)；≤0 按全部权益估
  sizing_mode: risk_pct
  # 凯利公式（可选）：打开后意图手数改用你手填的胜率、盈亏比，不再用每笔风险%或固定手数。
  # 自己跑完历史回测，把摘要里的胜率和「平均盈利÷平均亏损」填进来。仓位上限、日亏损、波动暂停仍有效。
  kelly:
    enabled: false
    fraction: 0.5          # 0.25=四分之一 0.5=一半 1=全凯利
    max_f_pct: 2           # 每笔最多拿本金的百分之几去冒险
    win_rate_pct: 46       # 胜率，46 表示 46%
    payoff: 1.2            # 盈亏比 = 平均盈利 ÷ 平均亏损（不是盈利因子）
  # 当前账户余额。配置页只显示，不在这里手改。要改去账户分析。
  # 历史回测和策略优化可以另填一个数，用来测保证金高的品种，也可以再从配置页抄回当前余额。
  capital: 1000000
  risk_per_trade_pct: 0.5
  # 权益里最多拿出这么多交保证金，推荐 70~80。例：2 手×10500、上限 70% → 权益至少约 30000
  margin_usage_pct: 80
  min_volume: 1
  max_daily_loss: 5000
  min_order_interval_sec: 60
  max_orders_per_day: 20
  # 账户从最高点回撤、或波动突然放大时少开/暂停。日最大亏损仍只看当天。
  # 1 手账户减半仍是 1 手，不会被强平。enabled: false 就不再压这一层。
  dynamic:
    enabled: true
    dd_half_pct: 5
    dd_pause_pct: 10
    atr_half_mult: 1.8
    atr_pause_mult: 2.5
    atr_period: 14
    atr_lookback: 20
    reduce_held: true
  # 每手保证金。0 表示不看。表里没写的品种用这个数。
  margin_per_lot: 0
  # 关注合约+保证金/乘数只认这张总表（配置页可打开/重新读取）。同品种保证金必须相同。
  universe_table: config/品种与合约.xlsx
  margin_table: config/品种与合约.xlsx
  contracts:
    bu: { multiplier: 10, name: 沥青, margin: 0 }
    c: { multiplier: 10, name: 玉米, margin: 0 }

# 挂机防休眠：常驻运行时调用 Windows SetThreadExecutionState
runtime:
  keep_display_awake: true
  watchdog_enabled: true  # 主循环心跳看门狗；阈值 max(3×扫描间隔, 180 秒)
  # 策略健康停开（默认关）：连续 health_block_days 个交易日偏离最近回测时，只停开新仓。
  # 止损、反手平仓和收盘清仓不受影响。默认只在界面上提醒，不停手。
  health_block_entry: false
  health_block_days: 5
  # 收盘后自动关机（默认关）。有夜盘时等到夜盘最后清仓之后，不会在下午 14:55 就关
  auto_shutdown_after_close: false
  shutdown_grace_minutes: 5   # 过了最后收盘时刻后再等几分钟
  shutdown_delay_sec: 180     # 预约倒计时秒数；期间可执行 shutdown /a 取消
  # 告警外发（默认关）：熔断、断线、对账差异推到飞书群。
  alerts:
    external: "off"           # off | webhook
    min_level: "error"        # warning | error
    rate_limit_per_hour: 10   # 同一个 code 每小时最多外发几条
    webhook:
      kind: "feishu"
      url: ""                 # 飞书群机器人 webhook，只存本地，日志里不会打印
      timeout_sec: 5
  # 冷备守护（默认关）：主进程被结束后，另一个进程在交易时段内平掉持仓。
  # 需要单独启动 tools/guardian.py；整机断电/断网时守护进程同样不在，救不了。
  guardian:
    enabled: false
    poll_sec: 10
    stale_after_sec: 180
    max_close_attempts: 3
logging:
  level: "INFO"
  dir: "logs"
