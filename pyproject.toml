# 静态检查配置。项目本身不打包成 wheel，这里只放 ruff / mypy / pytest 的设置。

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["build", "dist", "data", "logs", "ctp"]

[tool.ruff.lint]
# 只开 pycodestyle 的明显错误和 pyflakes：能抓到未定义名字、未使用导入这类真问题，
# 不引入风格类规则，避免大规模改写已经在跑的交易代码。
select = ["E4", "E7", "E9", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 这些是启动入口：先改 sys.path 才能导入项目模块，导入不在文件顶部是有意的。
"src/__init__.py" = ["E402"]
"src/main.py" = ["E402"]
"src/ui/app.py" = ["E402"]
"src/login/ths_login.py" = ["E402"]
"src/trader/gui_trader.py" = ["E402"]
"tools/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
# 2026-11-14 基线 56.87%（1090 项测试）。门槛留不到 1 个点余量，既拦住明显回退，
# 又不因平台/依赖版本的小差异误报。补了用例再把这里往上调。
fail_under = 56
show_missing = true

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
exclude = ["^build/", "^dist/"]
# 历史代码按非严格模式接入：先不拦已经存在的旧写法，只强制下面这些近期改过、
# 并且已经按类型写清楚的核心模块。以后改动哪个模块，就把哪个模块加进来。
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "src.account.*",
    "src.backtest.metrics",
    "src.data.periods",
    "src.domain.*",
    "src.risk.*",
    "src.scheduler.order_executor",
    "src.scheduler.*",
    "src.strategy.daily_body",
    "src.strategy.indicators",
    "src.strategy.market_state",
    "src.utils.*",
    "src.utils.session_clock",
]
ignore_errors = false

[[tool.mypy.overrides]]
# 这几个是混入类：cfg、trader、strategy 这些共享状态定义在 TradingBot 上，
# 单看混入类会说「没有这个属性」。查别的错误，不查这一条。
module = ["src.scheduler.order_executor"]
ignore_errors = false
disable_error_code = ["attr-defined", "has-type"]

[[tool.mypy.overrides]]
# 常驻扫描的各个 Mixin 与 order_executor 同理，共享状态在 TradingBot 上。
module = ["src.scheduler.*"]
ignore_errors = false
disable_error_code = ["attr-defined", "has-type"]

[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
# 领域与内核是最底层：不得依赖任何业务、调度或界面模块。
name = "领域/内核不依赖业务层"
type = "forbidden"
source_modules = [
    "src.domain",
    "src.kernel",
]
forbidden_modules = [
    "src.utils",
    "src.data",
    "src.strategy",
    "src.trader",
    "src.risk",
    "src.account",
    "src.review",
    "src.backtest",
    "src.ops",
    "src.export",
    "src.screen",
    "src.research",
    "src.login",
    "src.scheduler",
    "src.ui",
]

[[tool.importlinter.contracts]]
# 业务层可以互相引用（数据/策略/回测之间仍有历史反向依赖，见 R9 验收报告），
# 但不能反过来依赖调度与界面。
name = "业务层不依赖调度与界面"
type = "forbidden"
source_modules = [
    "src.utils",
    "src.data",
    "src.strategy",
    "src.trader",
    "src.risk",
    "src.account",
    "src.review",
    "src.backtest",
    "src.ops",
    "src.export",
    "src.screen",
    "src.research",
    "src.login",
]
forbidden_modules = [
    "src.scheduler",
    "src.ui",
]

[[tool.importlinter.contracts]]
# 常驻调度只向上给界面用，不能反过来 import 界面。
name = "调度不依赖界面"
type = "forbidden"
source_modules = [
    "src.scheduler",
]
forbidden_modules = [
    "src.ui",
]
