# 均线波段（可隔夜）
name: ema_swing
route: |
  config.yaml → strategy.engine: ema_swing
  配置页选「均线波段」。周期和仓位用公共项。
  建议信号周期、止损周期都用 15 分钟（可试 30），不要用 5 分钟。
principle:
  - 方向选择器两根均线自己填根数（出厂 60/120）金叉只做多、死叉只做空
  - 信号三均线自己填根数（出厂 5/10/30，前面要比后面小）按方向排好；跳空错过交叉也可以开
  - 多空分界线（出厂 120）：做多要在上面、做空要在下面
  - 止损均线（出厂 120）开仓后跟着走
  - 倾角均线（出厂 120）走平不开；三根可以分开填
  - 「倾角不够就平仓」出厂关；打开后手里的仓也会平，方便对照收益
  - 空仓时日盘/夜盘收盘前若干分钟不开新仓（出厂 30，可改；午休不算）
  - 默认可拿到隔夜

defaults:
  dir_ema_pair: 60/120
  sig_ema_triple: 5/10/30
  side_ema: 120
  stop_ema: 120
  slope_ema: 120
  slope_min_deg: 3.0
  slope_lookback: 20
  slope_exit: false
  no_open_before_close_min: 30
  flatten_at_close: false

notes:
  - 不用 MACD 柱子，也不看 DIF/DEA
  - 旧引擎名 macd_swing 仍打开这一套
  - 建议 15 分钟及以上；5 分钟下影线容易碰到止损均线
  - 主力连续换月：旧仓还在则次日在新主力同方向移仓；交割月不再交易旧合约
