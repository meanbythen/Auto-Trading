# 长线箱体突破
name: swing_box
route: |
  config.yaml → strategy.engine: swing_box
  回测页的策略引擎里选「长线箱体突破」。加上这一套不会自动改掉正在用的策略。
principle:
  - 信号周期、止损周期跟配置页/回测页。没填时默认日线
  - 用最近约 40 根信号周期 K 线找有效高点和有效低点（左右各 2 根确认的拐点），两个高点、两个低点取平均当箱沿
  - 箱子太矮（高度不到 1.2 倍 ATR）或 ADX 太低，不当成合格箱子
  - 只认收盘价走出箱子。盘中刺破、收盘收回去，不算突破
  - 开仓后这口箱子冻住，后面行情再出新高也不改箱沿
  - 假突破：收盘走回箱子里面，立刻平仓
  - 浮盈还没到 1 倍箱子高度时，止损不动；够了才按新高/新低下 2 倍 ATR 跟踪
  - 默认不收盘清仓，仓可以隔夜、隔周
  - 上一笔走完后，要先回到箱子里，再等下一次突破，不立刻追同一口破位
  - 手数走公共的每笔风险%，算不出 1 手就放弃
  - 第一版不加仓、不用周线共振、不按长假日历停手
parameters:
  lookback: 40
  peak_look: 2
  min_gap: 5
  atr_period: 20
  height_atr: 1.2
  adx_period: 14
  adx_min: 20
  stop_atr: 0.5
  trail_atr: 2.0
  trail_start_h: 1.0
  vol_mult: 0
  flatten_at_close: false
notes:
  - 和日内实体是兄弟，不是替换。日内抓一天，这套抓几周到几个月
  - 胜率不会高，靠少数大趋势覆盖前面的小亏损
  - 详细规则见 docs/长线箱体突破操作说明书.md 和 docs/长线箱体突破策略/
