# 早盘箱体突破（方案A，主推；日盘+夜盘）
name: morning_box_a
route: |
  config.yaml → strategy.engine: morning_box_a（短名 morning_a）
principle:
  - 日盘：09:00–09:30 观察记 H30/L30；09:30–10:30 放量收盘突破定方向；假突破本段封仓
  - 夜盘同一套：21:00≈09:00，21:30≈09:30，22:30≈10:30，23:00≈15:00（可 enable_night 关掉）
  - 回踩箱体边界企稳入场；止损在箱体另一侧外；浮盈达箱体高度约 0.9 倍后移损到成本
  - 无主动止盈；不触发则拿到本段收盘（日盘 14:55 / 夜盘 22:55，不是 23:00）；每段最多两笔
  - 开仓窗内可开到截止点；临清仓 15 分钟不新开
  - 和旧的「日内实体」daily_body 不是同一套
