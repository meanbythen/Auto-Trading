# 趋势跟随
name: trend_follow
route: |
  config.yaml → strategy.engine: trend_follow
  回测页的策略引擎里选 trend_follow。加上这一套不会自动改掉正在用的策略。
principle:
  - 研究里捕捉一整段行情，靠的是价格自己这段时间一直往一个方向走
  - 期货上这个规律在大约 1 到 12 个月最清楚。5 分钟上的 36 根只是大约 3 小时，要跟踪长期就改用更长的周期
  - 收盘升破前 36 根最高价做多，跌破前 36 根最低价做空。不看成交量
  - 开仓止损放在进场价外面 2 倍平均波动。之后只往赚钱的方向收紧
  - 收盘跌回前 12 根的另一边，说明这段走完了，先平仓
  - 默认不按 14:55、22:55 清仓。配置页的收盘清仓总开关不管这一套
  - 不改动流动性耗尽，也不改动 MACD 背离
