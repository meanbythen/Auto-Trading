# 趋势跟随 / 海龟突破
name: trend_follow
route: |
  config.yaml → strategy.engine: trend_follow
  回测页的策略引擎里选 trend_follow。加上这一套不会自动改掉正在用的策略。
principle:
  - 研究里捕捉一整段行情，靠的是价格自己这段时间一直往一个方向走
  - 《策略基础逻辑》第 2 套的 5 分钟日内版：收盘升破前 20 根最高价做多，跌破前 20 根最低价做空。不看成交量
  - 开仓止损放在进场价外面 2 倍平均波动。之后只往赚钱的方向收紧
  - 收盘跌回前 10 根的另一边，说明这段走完了，先平仓
  - 市场状态过滤：ADX < 20 或 ATR 处于近 60 根最低 20% 分位时不开新仓（海龟最怕假突破）
  - 默认按 14:55、22:55 强平（5 分钟日内口径）。做日线波段时把 flatten_at_close 改成 false

defaults:
  entry_bars: 20
  exit_bars: 10
  atr_period: 14
  atr_mult: 2.0
  flatten_at_close: true

notes:
  - 老配置里的 36/12 是 3 小时口径；文档版是 20/10，两个都能用，回测对比后自己定
  - 原版海龟还有「每 0.5ATR 加一层、最多 4 层」；本程序不下金字塔加仓，只做单笔开平
  - 5 分钟上假突破密集，务必保留市场过滤
