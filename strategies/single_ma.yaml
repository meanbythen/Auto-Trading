# 单均线系统（界面显示 Single_ma）
name: Single_ma
route: |
  config.yaml → strategy.engine: Single_ma
  配置页「单均线根数」可改成 20 / 60 / 80 / 120 等。
principle:
  - 用一根可设置根数的收盘均线（SMA）当分界：收盘在线上偏多，线下偏空
  - 开仓信号只有一种：收盘刚从均线一侧穿到另一侧。穿上做多，穿下做空
  - 不做成交量、影线比例、ATR 倍数等拟合过滤
  - 持仓后止损跟着当前均线走；收盘穿回对面就平仓（默认可反手）
  - 是否 14:55、22:55 清仓，听配置页「收盘清仓」总开关
  - 和双均线趋势、海龟通道、SuperTrend 不是同一套

defaults:
  ma_period: 20
  reverse_on_cross: true

notes:
  - 根数越大越稳、信号越少；5 分钟上用 120 相当于看更长一段
  - 震荡市会反复穿越；想少抽打优先换更大周期或更大根数
