# 多因子投票（对照）
name: multi_vote
route: |
  config.yaml → strategy.engine: multi_vote（短名 vote）
  配置页策略下拉选「多因子投票」。四个因子参数和加权打分版共用 strategy.multi_factor。
principle:
  - 四个因子与加权打分版完全相同，只把分数收成投多 / 投空 / 弃权
  - 至少 min_votes 张同向票，且多空票差达到 min_vote_diff，才开仓
  - 日线定方向、SAR 开关、信号周期都跟加权版同一套规则
  - 本策略行情过滤：ADX/ATR/分歧；弱趋势时要更多同向票
  - 反向投票占优离场，或被 2 倍 ATR 止损打掉

defaults:
  min_votes: 2
  min_vote_diff: 2
  flatten_at_close: true
  cta_filter:
    enabled: true
    use_adx: true
    use_atr: true
    use_disagree: true
    adx_period: 14
    adx_flat: 20
    adx_trend: 25
    atr_lookback: 60
    atr_low_pct: 0.2
    weak_score: 0.0
    weak_size: 1.0
    weak_votes: 3

notes:
  - 用来和加权打分对照：投票更不容易被某一个半票因子带偏
  - 天勤这一版没有日线时，方向过滤会拦住新开仓，请把行情源切到新浪或东方财富
