# 布林带趋势突破
name: bollinger
route: |
  config.yaml → strategy.engine: bollinger（短名 boll）
  配置页策略下拉选「布林带突破」。参数在 config.yaml 的 strategy.bollinger。
principle:
  - 《策略基础逻辑》第 3 套。只做顺势突破，不做轨道反转（反转属于均值回归，是散户亏损重灾区）
  - 中轨 = EMA20；上轨/下轨 = 中轨 ± 2 倍标准差（标准差仍按收盘价窗口）
  - 价格在中轨上方、且收盘突破上轨 → 做多；中轨下方、且收盘跌破下轨 → 做空
  - 止损：开仓价外 1.5 倍 ATR（比「跌破中轨」更稳）
  - 出场：收盘跌回中轨（多）或站回中轨（空）
  - 市场状态过滤：ADX < 20 或 ATR 低分位时不开新仓；中轨走平本来就是最差的环境
  - 收盘清仓听配置页「收盘清仓」总开关，不再写死每天平仓

defaults:
  boll_window: 20
  boll_dev: 2.0
  atr_period: 14
  atr_stop_mult: 1.5
  flatten_at_close: true

notes:
  - 布林自带波动率自适应：波动放大通道变宽，不容易被正常波动扫掉
  - 震荡里会反复刺破上下轨再收回，所以市场过滤不能关
  - 优化网格只搜轨道周期、标准差倍数和止损倍数，不去拟合更多门槛
