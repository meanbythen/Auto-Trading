# 双均线趋势（经典金叉/死叉）
name: dual_ma
route: |
  config.yaml → strategy.engine: dual_ma（短名 ma_cross）
  配置页「双均线短根数 / 长根数」可改，默认 20 / 60。
principle:
  - 短均线上穿长均线（金叉）做多，下穿（死叉）做空
  - 止损跟着长均线走；反向交叉默认可反手
  - 不加成交量、影线、ATR 倍数等拟合门槛
  - 是否 14:55、22:55 清仓，听配置页「收盘清仓」总开关
  - 和「价格穿单均线」不是同一套：这里看的是两根均线彼此交叉

defaults:
  short_period: 20
  long_period: 60
  reverse_on_cross: true

notes:
  - 20/60 是常见教科书搭配；也可用 10/60、20/120 等，短必须小于长
  - 比单均线通常少一些噪音，但仍会在震荡里来回交叉
  - 适合作为「少参数趋势跟随」对照单均线一起回测
