# 双均线趋势（经典金叉/死叉）
name: dual_ma
route: |
  config.yaml → strategy.engine: dual_ma（短名 ma_cross）
  配置页「双均线短根数 / 长根数」可改，默认 20 / 60，都是指数均线（EMA）。
principle:
  - 方向：价格在长 EMA 上方只做多，下方只做空（《策略基础逻辑》第 1 套）
  - 短 EMA 上穿长 EMA（金叉）且收盘站上长线才做多；死叉且收盘跌破长线才做空
  - 止损用开仓价外 2 倍 ATR（默认 14 根），比「开仓那根高低点」宽，不容易被正常波动扫掉
  - 出场：反向交叉平仓（reverse_on_cross=true 时反手）
  - 市场状态过滤：ADX < 20 或 ATR 处于近 60 根最低 20% 分位时不开新仓
  - 是否 14:55、22:55 清仓，听配置页「收盘清仓」总开关

defaults:
  short_period: 20
  long_period: 60
  reverse_on_cross: true
  atr_period: 14
  atr_stop_mult: 2.0

notes:
  - 20/60 是常见教科书搭配；也可用 10/60、20/120 等，短必须小于长
  - 用双均线交叉过滤掉单根均线频繁翻转的噪音，但仍会在震荡里来回交叉，所以靠市场过滤挡震荡
  - 适合作为「少参数趋势跟随」的对照策略
