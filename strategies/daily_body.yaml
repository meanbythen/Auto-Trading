# 日内实体
name: daily_body
route: |
  config.yaml → strategy.engine: daily_body
  回测页的策略引擎里选 daily_body。加上这一套不会自动改掉正在用的策略。
principle:
  - 日盘 9:00、夜盘 21:00 起的 ETH 只用来画开盘区间。ETH 走完之前不开仓
  - 方向看「当前信号周期」。5/15/30/60 同一套标准；信号是更细的分钟时，先收成信号周期再看。没收完的中间时刻先等
  - 开盘区间是 ETH 里已经走完的信号 K 线最高价和最低价。默认 ETH 20 分钟时，15 分钟信号日盘第一根能定方向的多是 9:45；5 分钟信号会更早
  - 信号周期收盘站上区间最高价才做多，跌破区间最低价才做空
  - 收盘还在区间里面，或者只是影线刺出去又收回来，就继续等。这一等不占掉后面的开仓
  - 这根信号 K 还有一段落在 ETH 里时，不用它定方向
  - 日盘、夜盘各有开仓截止钟点（`day_cutoff` 默认 10:30，`night_cutoff` 默认 22:15），过了不再追。13:30 不重新画区间
  - 日盘第一段（ETH20）开仓打到箱沿止损后、截止钟点以前，用第二段 ETH（`eth_minutes2` 默认 30，填 0 关闭）的箱体收盘突破再开一次；第二次止损后不再开。只有止损出场才算数，手动平或收盘平不开第二次
  - 开仓上限：日盘每段最多 2 次，夜盘每段只开 1 次
  - 公共设置「交易时段」可选全时段、只做日盘、只做夜盘，只拦开新仓；已经拿着的仓仍按止损和收盘清仓走
  - 止损只认开盘箱体对沿：多单守箱底外若干跳，空单守箱顶外若干跳；开仓后冻结，盘中不收紧
  - 止损触发方式按全策略共用的 `strategy.stop_mode`：touch 价格触及对沿就平（默认，看当前影线）；close 等这根 K 线收盘价跌破/站上对沿才平。否则顺着捅破方向拿到这段收盘
  - 不做盈利回撤止损，也不另用 ATR 底线
  - 配置页可改：ETH 分钟数、二次开仓ETH分钟数、日盘/夜盘开仓截止时间、箱沿外再让几跳（stop_extra_ticks，默认 1，填 0 则贴着箱沿）
  - 这一段开盘相对上一段收盘跳空超过 skip_gap_ticks 跳就不开（默认 50，填 0 关闭）。跳空太大时箱沿止损会被缺口一次打穿，宁可不做
  - 开盘箱体最高-最低超过 max_box_ticks 跳就不开（默认 100，填 0 关闭）。箱体越宽，箱沿止损离进场价越远，止损金额跟着放大
  - 优化可搜：ETH 分钟数、信号周期、止损触发方式、日盘/夜盘开仓截止时间、交易时段（精简深度只搜前三项）
  - 成交才算名额（以开仓成功为准；只出信号未成交不占名额）。日盘止损一次后可再开一次，平掉之后不再多开
  - 重启会从状态文件恢复「这一段已用过」，避免同一段再开
  - 有持仓且 `stop_mode=touch` 时，止损会看当前未收盘 K 线的影线；`close` 时只用已收盘 K 线
  - 收盘清仓听配置页总开关
  - 日线、周线没有开盘后的 ETH 区间，这套不判断
