# 多因子混合（投票开门 + 打分定仓）
name: multi_hybrid
route: |
  config.yaml → strategy.engine: multi_hybrid（短名 hybrid）
  配置页策略下拉选「多因子混合」。因子参数和加权打分版共用。
principle:
  - 投票层决定能不能开仓（和多因子投票同一套门槛）
  - 打分层决定开几成仓：总分刚过阈值用 50% 风控手数，满分用 100%
  - 本策略行情过滤：ADX/ATR/分歧；弱趋势时票要更多、总分要更高，仓位再打成数
  - 反向投票或反向总分离场，另有 2 倍 ATR 跟踪止损

defaults:
  min_votes: 2
  min_vote_diff: 2
  threshold: 0.6
  min_position_ratio: 0.5
  max_position_ratio: 1.0
  flatten_at_close: true
  cta_filter:
    enabled: true
    use_adx: true
    use_atr: true
    use_disagree: true
    adx_period: 14
    adx_flat: 20
    adx_trend: 25
    atr_lookback: 60
    atr_low_pct: 0.2
    weak_score: 0.75
    weak_size: 0.5
    weak_votes: 3

notes:
  - 信号弱就少开一点，信号强才开满，风险仍受资金管理那一页限制
  - 1 手账户上打五折仍是 1 手，因为期货不能开 0.5 手
