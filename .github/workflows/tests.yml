name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 项目依赖同花顺窗口操作、keyboard、uiautomation，只能在 Windows 上装齐。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Dependency audit
        run: python -m pip_audit -r requirements.lock

      # 本地与 CI 共用同一入口：pytest(带覆盖率) + ruff + mypy + 导入契约 + 文档版本校验。
      - name: Test gate
        run: python tools/testkit.py gate --coverage

  build:
    # 在 Windows 上真打一次 onedir 包，再启动 exe 看它能不能活过启动阶段。
    # 漏打资源或 hiddenimports 时，这里会比用户先发现。
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt
            requirements-build.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements-build.txt

      # 预检 → 清理 → PyInstaller → 收尾 → 验收 → 元数据 → 12 秒启动冒烟，
      # 与本地「打包成EXE.bat」完全同一条路径。
      - name: Build and verify exe
        run: python tools/build_exe.py
